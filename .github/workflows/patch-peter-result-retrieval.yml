name: Patch Peter encrypted-result retrieval

on:
  push:
    paths:
      - '.github/workflows/patch-peter-result-retrieval.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add retry window after Peter PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/peter-private-benchmark.yml')
          s = p.read_text()
          old = '''            if [[ "$status" == PASS ]]; then
              curl -fsS --max-time 60 -H "X-DGBN-Token: $token" "$base/result.enc" -o peter-musetalk-12s.enc
              test -s peter-musetalk-12s.enc
              echo 'PETER_MUSETALK_12S=PASS'
              exit 0
'''
          new = '''            if [[ "$status" == PASS ]]; then
              result_ready=0
              for attempt in $(seq 1 15); do
                if curl -fsS --max-time 30 -H "X-DGBN-Token: $token" "$base/result.enc" -o peter-musetalk-12s.enc 2>/dev/null && [[ -s peter-musetalk-12s.enc ]]; then
                  result_ready=1
                  break
                fi
                rm -f peter-musetalk-12s.enc
                echo "Encrypted result not visible yet; retry $attempt/15."
                sleep 2
              done
              [[ "$result_ready" == 1 ]]
              echo 'PETER_MUSETALK_12S=PASS'
              exit 0
'''
          if old not in s:
              raise SystemExit('Expected Peter result-retrieval block not found; refusing blind patch')
          s = s.replace(old, new, 1)
          # Keep the RunPod package's installed cryptography version instead of downgrading it.
          s = s.replace("gdown 'cryptography>=42,<46' mmengine==0.10.7", "gdown 'cryptography>=50,<51' mmengine==0.10.7", 1)
          p.write_text(s)
          PY
          git config user.name 'DGBN CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/peter-private-benchmark.yml
          git diff --cached --check
          git commit -m 'Retry encrypted Peter result retrieval after PASS'
          git push origin HEAD:main
