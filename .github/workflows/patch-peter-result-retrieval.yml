name: Patch Peter render ceiling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-peter-result-retrieval.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extend Peter benchmark only while active work continues
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/peter-private-benchmark.yml')
          s = p.read_text()
          replacements = [
              ('    timeout-minutes: 18\n', '    timeout-minutes: 35\n'),
              ('          for i in $(seq 1 180); do\n', '          for i in $(seq 1 360); do\n'),
              ("          echo 'Peter benchmark exceeded fifteen-minute wait.' >&2\n", "          echo 'Peter benchmark exceeded thirty-minute wait.' >&2\n"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected benchmark text not found: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'DGBN CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/peter-private-benchmark.yml
          git diff --cached --check
          git commit -m 'Extend Peter benchmark render ceiling'
          git push origin HEAD:main
