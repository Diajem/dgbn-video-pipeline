name: Patch Peter result cache race

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-peter-result-retrieval.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make Peter result retrieval cache-safe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/peter-private-benchmark.yml')
          s = p.read_text()

          old = "          from pathlib import Path\n          ROOT = Path('/tmp/dgbn')\n"
          new = "          from pathlib import Path\n          from urllib.parse import urlparse\n          ROOT = Path('/tmp/dgbn')\n"
          if old not in s:
              raise SystemExit('Result server import block not found')
          s = s.replace(old, new, 1)

          old = "                  p = names.get(self.path)\n"
          new = "                  p = names.get(urlparse(self.path).path)\n"
          if old not in s:
              raise SystemExit('Result server path lookup not found')
          s = s.replace(old, new, 1)

          old = """              curl -fsS --max-time 45 \"$base/bootstrap.log\" -o /tmp/bootstrap.log
              python - <<'PY2'
"""
          new = """              got=0
              for j in $(seq 1 30); do
                nonce=$(date +%s%N)
                curl -fsS --max-time 30 \"$base/bootstrap.log?nonce=$nonce\" -o /tmp/bootstrap.log 2>/dev/null || true
                if grep -q 'DGBN_RESULT_B64_BEGIN' /tmp/bootstrap.log 2>/dev/null && grep -q 'DGBN_RESULT_B64_END' /tmp/bootstrap.log 2>/dev/null; then
                  got=1
                  break
                fi
                sleep 2
              done
              [[ \"$got\" == 1 ]]
              python - <<'PY2'
"""
          if old not in s:
              raise SystemExit('PASS result-fetch block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'DGBN CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/peter-private-benchmark.yml
          git diff --cached --check
          git commit -m 'Make Peter encrypted-result retrieval cache-safe'
          git push origin HEAD:main
