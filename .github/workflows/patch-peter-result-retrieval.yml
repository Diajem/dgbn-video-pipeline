name: Patch Peter benchmark runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-peter-result-retrieval.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Slim normal-Pod setup and extend render window
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/peter-private-benchmark.yml')
          s = p.read_text()
          replacements = [
            ('    timeout-minutes: 12\n', '    timeout-minutes: 18\n'),
            (
              '            python -m pip install --no-cache-dir --disable-pip-version-check -r https://raw.githubusercontent.com/Diajem/dgbn-video-pipeline/main/runpod/requirements-worker.txt\n',
              "            curl -fsSL https://raw.githubusercontent.com/Diajem/dgbn-video-pipeline/main/runpod/requirements-worker.txt | grep -v '^runpod$' > /tmp/peter-requirements.txt\n            python -m pip install --no-cache-dir --disable-pip-version-check -r /tmp/peter-requirements.txt\n"
            ),
            ("gdown 'cryptography>=42,<46' mmengine==0.10.7", "gdown 'cryptography>=50,<51' mmengine==0.10.7"),
            ('          for i in $(seq 1 96); do\n', '          for i in $(seq 1 180); do\n'),
            ("          echo 'Peter benchmark exceeded eight-minute wait.' >&2\n", "          echo 'Peter benchmark exceeded fifteen-minute wait.' >&2\n"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected benchmark text not found: {old[:80]!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'DGBN CI'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/peter-private-benchmark.yml
          git diff --cached --check
          git commit -m 'Slim Peter benchmark setup and extend render window'
          git push origin HEAD:main
