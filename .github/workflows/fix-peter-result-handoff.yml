name: Fix Peter result handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-peter-result-handoff.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix-and-dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Remove runner ffprobe dependency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/runpod-peter-private-benchmark.yml')
          s=p.read_text()
          old='''                ffprobe -v error -show_entries format=duration,size -of default=nw=1 /tmp/peter-result.mp4\n                exit 0'''
          new='''                bytes=$(stat -c%s /tmp/peter-result.mp4)\n                echo "Peter result downloaded: ${bytes} bytes"\n                [[ "$bytes" -gt 10000 ]]\n                exit 0'''
          if old not in s:
              raise SystemExit('Expected runner-side ffprobe block not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'Diajem Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/runpod-peter-private-benchmark.yml
          git commit -m 'Fix Peter benchmark result handoff'
          git push origin HEAD:main
      - name: Dispatch corrected Peter benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/runpod-peter-private-benchmark.yml/dispatches \
            -d '{"ref":"main"}'
          echo 'Corrected Peter benchmark dispatched.'
