name: Peter private MuseTalk benchmark

on:
  push:
    branches:
      - 'peter-private-benchmark-*'
    paths:
      - '.private/peter/part_*'

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      RUNPOD_API_KEY_RAW: ${{ secrets.RUNPOD_API_KEY }}
      POD_NAME: dgbn-peter-private-benchmark
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt private Peter benchmark inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/peter-private
          cat .private/peter/part_* > /tmp/peter-private/payload.b64
          base64 -d /tmp/peter-private/payload.b64 > /tmp/peter-private/payload.enc
          python -m pip install --quiet 'cryptography>=42,<46'
          python - <<'PY'
          import os, hashlib, zipfile
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey, X25519PublicKey
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          raw = os.environ.get('RUNPOD_API_KEY_RAW','').strip().strip('“”‘’\"\'`')
          if not raw:
              raise SystemExit('RUNPOD_API_KEY missing')
          blob = Path('/tmp/peter-private/payload.enc').read_bytes()
          magic = b'DGBNPTR2'
          if blob[:8] != magic:
              raise SystemExit('Invalid private payload magic')
          eph_pub, nonce, ciphertext = blob[8:40], blob[40:52], blob[52:]
          seed = hashlib.sha256(b'DGBN-PETER-PRIVATE-TRANSFER-V1\0' + raw.encode()).digest()
          priv = X25519PrivateKey.from_private_bytes(seed)
          shared = priv.exchange(X25519PublicKey.from_public_bytes(eph_pub))
          key = HKDF(algorithm=hashes.SHA256(), length=32, salt=None, info=b'DGBN-PETER-PRIVATE-TRANSFER-V2').derive(shared)
          plain = AESGCM(key).decrypt(nonce, ciphertext, magic + eph_pub)
          zip_path = Path('/tmp/peter-private/input.zip')
          zip_path.write_bytes(plain)
          out = Path('/tmp/peter-private/input')
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(zip_path) as z:
              expected = {'peter.jpg','peter.mp3','return_public.b64'}
              if not expected.issubset(set(z.namelist())):
                  raise SystemExit('Private benchmark archive missing required files')
              z.extractall(out)
          if (out/'peter.jpg').stat().st_size < 10000 or (out/'peter.mp3').stat().st_size < 10000:
              raise SystemExit('Private benchmark media validation failed')
          print('Private Peter inputs decrypted and validated in runner memory/disk.')
          PY

      - name: Create isolated Peter benchmark Pod
        id: create
        shell: bash
        run: |
          set -euo pipefail
          key=$(python - <<'PY'
          import os
          print(os.environ.get('RUNPOD_API_KEY_RAW','').strip().strip('“”‘’\"\'`'))
          PY
          )
          test -n "$key"
          echo "::add-mask::$key"
          AUTH="Authorization: Bearer $key"

          endpoints=$(curl -fsS -H "$AUTH" https://rest.runpod.io/v1/endpoints)
          endpoint_id=$(jq -r '.[] | select(.name=="dgbn-video-pipeline") | .id' <<<"$endpoints" | head -1)
          if [[ -n "$endpoint_id" && "$endpoint_id" != null ]]; then
            curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' -d '{"workersMin":0,"workersMax":0}' "https://rest.runpod.io/v1/endpoints/$endpoint_id/update" >/dev/null
          fi

          pods=$(curl -fsS -H "$AUTH" https://rest.runpod.io/v1/pods)
          while IFS= read -r stale_id; do
            [[ -z "$stale_id" ]] && continue
            curl -fsS -X DELETE -H "$AUTH" "https://rest.runpod.io/v1/pods/$stale_id" >/dev/null || true
          done < <(jq -r '.[] | select(.name=="dgbn-peter-private-benchmark") | .id' <<<"$pods")

          peter_jpg=$(base64 -w0 /tmp/peter-private/input/peter.jpg)
          peter_mp3=$(base64 -w0 /tmp/peter-private/input/peter.mp3)
          return_pub=$(tr -d '\r\n' < /tmp/peter-private/input/return_public.b64)

          BOOTSTRAP=$(cat <<'CMD'
          set -euo pipefail
          mkdir -p /tmp/dgbn/input /tmp/dgbn/results
          cat > /tmp/dgbn/result_server.py <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          ROOT = Path('/tmp/dgbn')
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  names = {'/status.txt':ROOT/'status.txt','/bootstrap.log':ROOT/'bootstrap.log','/result.enc':ROOT/'result.enc'}
                  p = names.get(self.path)
                  if not p or not p.exists():
                      self.send_response(404); self.end_headers(); return
                  data = p.read_bytes()
                  self.send_response(200)
                  self.send_header('Content-Length', str(len(data)))
                  self.send_header('Content-Type','application/octet-stream')
                  self.end_headers(); self.wfile.write(data)
              def log_message(self, *_): return
          ThreadingHTTPServer(('0.0.0.0',8000), H).serve_forever()
          PY
          echo BOOTING > /tmp/dgbn/status.txt
          python /tmp/dgbn/result_server.py >/tmp/dgbn/result-server.log 2>&1 &

          (
            set -euxo pipefail
            export PYTHONUNBUFFERED=1
            printf '%s' "$PETER_JPG_B64" | base64 -d > /tmp/dgbn/input/peter.jpg
            printf '%s' "$PETER_MP3_B64" | base64 -d > /tmp/dgbn/input/peter.mp3
            printf '%s\n' "$RETURN_PUBLIC_B64" > /tmp/dgbn/input/return_public.b64
            unset PETER_JPG_B64 PETER_MP3_B64 RETURN_PUBLIC_B64

            python - <<'PY'
          import torch
          print('BASE', torch.__version__, torch.version.cuda, torch.cuda.is_available(), torch.cuda.get_device_name(0))
          assert torch.__version__.startswith('2.1.0') and torch.version.cuda == '11.8' and torch.cuda.is_available()
          PY

            curl -fsSL https://raw.githubusercontent.com/Diajem/dgbn-video-pipeline/main/runpod/requirements-worker.txt | grep -v '^runpod$' > /tmp/peter-requirements.txt
            python -m pip install --no-cache-dir --disable-pip-version-check -r /tmp/peter-requirements.txt
            python -m pip install --no-cache-dir --disable-pip-version-check gdown 'cryptography>=50,<51' mmengine==0.10.7 'mmdet==3.2.0' 'mmpose==1.2.0' chumpy==0.70 json-tricks munkres xtcocotools pycocotools shapely terminaltables addict termcolor 'yapf<0.41' 'matplotlib<3.8'
            python -m pip install --no-cache-dir --disable-pip-version-check 'mmcv==2.1.0' -f https://download.openmmlab.com/mmcv/dist/cu118/torch2.1.0/index.html
            python -m pip install --no-cache-dir --force-reinstall --no-deps numpy==1.23.5 opencv-python-headless==4.9.0.80

            rm -rf /opt/MuseTalk /tmp/MuseTalk-main /tmp/musetalk.tar.gz
            python - <<'PY'
          import urllib.request, tarfile
          urllib.request.urlretrieve('https://github.com/TMElyralab/MuseTalk/archive/refs/heads/main.tar.gz','/tmp/musetalk.tar.gz')
          with tarfile.open('/tmp/musetalk.tar.gz','r:gz') as t: t.extractall('/tmp')
          PY
            mv /tmp/MuseTalk-main /opt/MuseTalk
            cd /opt/MuseTalk

            if ! command -v ffmpeg >/dev/null 2>&1; then
              ffmpeg_bin=$(python - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
              )
              ln -sf "$ffmpeg_bin" /usr/local/bin/ffmpeg
            fi

            mkdir -p models/dwpose models/face-parse-bisent models/sd-vae models/whisper models/musetalkV15 "$HOME/.cache/torch/hub/checkpoints"
            huggingface-cli download stabilityai/sd-vae-ft-mse --local-dir models/sd-vae --include 'config.json' 'diffusion_pytorch_model.bin'
            huggingface-cli download openai/whisper-tiny --local-dir models/whisper --include 'config.json' 'pytorch_model.bin' 'preprocessor_config.json'
            huggingface-cli download yzd-v/DWPose --local-dir models/dwpose --include 'dw-ll_ucoco_384.pth'
            huggingface-cli download TMElyralab/MuseTalk --local-dir models --include 'musetalkV15/musetalk.json' 'musetalkV15/unet.pth'
            gdown 154JgKpzCPW82qINcVieuPH3fZ2e0P812 -O models/face-parse-bisent/79999_iter.pth
            python - <<'PY'
          import urllib.request
          urllib.request.urlretrieve('https://download.pytorch.org/models/resnet18-5c106cde.pth','models/face-parse-bisent/resnet18-5c106cde.pth')
          urllib.request.urlretrieve('https://www.adrianbulat.com/downloads/python-fan/s3fd-619a316812.pth','/root/.cache/torch/hub/checkpoints/s3fd-619a316812.pth')
          PY

            python - <<'PY'
          from pathlib import Path
          p=Path('scripts/inference.py')
          s=p.read_text()
          s=s.replace('            # Extract frames from source video\n            if get_file_type(video_path) == "video":', '            # Extract frames from source video\n            save_dir_full = None\n            if get_file_type(video_path) == "video":')
          s=s.replace('            shutil.rmtree(save_dir_full)\n', '            if save_dir_full and os.path.isdir(save_dir_full):\n                shutil.rmtree(save_dir_full)\n')
          p.write_text(s)
          PY

            ffmpeg -y -v error -i /tmp/dgbn/input/peter.mp3 -t 12 -ac 1 -ar 16000 /tmp/dgbn/input/peter.wav
            cat > /tmp/dgbn/inference.yaml <<'YAML'
          peter:
            video_path: "/tmp/dgbn/input/peter.jpg"
            audio_path: "/tmp/dgbn/input/peter.wav"
            result_name: "peter_musetalk_12s.mp4"
          YAML
            python -m scripts.inference --inference_config /tmp/dgbn/inference.yaml --result_dir /tmp/dgbn/results --unet_model_path models/musetalkV15/unet.pth --unet_config models/musetalkV15/musetalk.json --version v15
            result=$(find /tmp/dgbn/results -type f -name 'peter_musetalk_12s.mp4' | head -1)
            test -n "$result" && test -s "$result"

            python - <<'PY'
          import base64, os
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey, X25519PublicKey
          from cryptography.hazmat.primitives.kdf.hkdf import HKDF
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
          result = next(Path('/tmp/dgbn/results').rglob('peter_musetalk_12s.mp4'))
          print('PETER_RESULT_BYTES', result.stat().st_size)
          pub = X25519PublicKey.from_public_bytes(base64.b64decode(Path('/tmp/dgbn/input/return_public.b64').read_text().strip()))
          eph = X25519PrivateKey.generate()
          eph_pub = eph.public_key().public_bytes(Encoding.Raw, PublicFormat.Raw)
          key = HKDF(algorithm=hashes.SHA256(), length=32, salt=None, info=b'DGBN-PETER-RETURN-V1').derive(eph.exchange(pub))
          nonce = os.urandom(12); magic = b'DGBNOUT1'
          ciphertext = AESGCM(key).encrypt(nonce, result.read_bytes(), magic + eph_pub)
          encrypted = magic + eph_pub + nonce + ciphertext
          Path('/tmp/dgbn/result.enc').write_bytes(encrypted)
          print('DGBN_RESULT_B64_BEGIN')
          print(base64.b64encode(encrypted).decode('ascii'))
          print('DGBN_RESULT_B64_END')
          PY
            rm -f /tmp/dgbn/input/peter.jpg /tmp/dgbn/input/peter.mp3 /tmp/dgbn/input/peter.wav /tmp/dgbn/input/return_public.b64
            echo PASS > /tmp/dgbn/status.txt
          ) > /tmp/dgbn/bootstrap.log 2>&1 || { rc=$?; echo "FAIL:$rc" > /tmp/dgbn/status.txt; echo "FAIL:$rc" >> /tmp/dgbn/bootstrap.log; }
          wait
          CMD
          )

          payload=$(jq -n --arg name "$POD_NAME" --arg cmd "$BOOTSTRAP" --arg jpg "$peter_jpg" --arg mp3 "$peter_mp3" --arg ret "$return_pub" '{
            name:$name,
            imageName:"runpod/pytorch:2.1.0-py3.10-cuda11.8.0-devel-ubuntu22.04",
            cloudType:"SECURE", computeType:"GPU", gpuCount:1,
            gpuTypeIds:["NVIDIA GeForce RTX 4090","NVIDIA RTX A5000","NVIDIA RTX A4500","NVIDIA RTX A4000","NVIDIA L4","NVIDIA GeForce RTX 3090","NVIDIA A40","NVIDIA RTX A6000"],
            gpuTypePriority:"availability",
            allowedCudaVersions:["11.8","12.0","12.1","12.2","12.3","12.4","12.5","12.6","12.7","12.8","12.9"],
            dataCenterPriority:"availability",
            containerDiskInGb:30, volumeInGb:0, ports:["8000/http"], supportPublicIp:true, interruptible:false, locked:false,
            env:{PETER_JPG_B64:$jpg,PETER_MP3_B64:$mp3,RETURN_PUBLIC_B64:$ret},
            dockerEntrypoint:["/bin/bash","-lc"], dockerStartCmd:[$cmd]
          }')
          response=$(curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' -d "$payload" https://rest.runpod.io/v1/pods)
          pod_id=$(jq -r '.id' <<<"$response")
          test -n "$pod_id" && test "$pod_id" != null
          echo "pod_id=$pod_id" >> "$GITHUB_OUTPUT"
          rm -rf /tmp/peter-private
          unset peter_jpg peter_mp3 return_pub payload response
          echo "Created isolated Peter benchmark Pod: $pod_id"

      - name: Wait for encrypted Peter result
        shell: bash
        run: |
          set -euo pipefail
          pod_id='${{ steps.create.outputs.pod_id }}'
          base="https://${pod_id}-8000.proxy.runpod.net"
          for i in $(seq 1 180); do
            status=$(curl -fsS --max-time 8 "$base/status.txt" 2>/dev/null || true)
            if [[ "$status" == PASS ]]; then
              curl -fsS --max-time 45 "$base/bootstrap.log" -o /tmp/bootstrap.log
              python - <<'PY2'
          import base64
          from pathlib import Path
          text = Path('/tmp/bootstrap.log').read_text(errors='replace')
          start = text.rfind('DGBN_RESULT_B64_BEGIN\n')
          end = text.rfind('\nDGBN_RESULT_B64_END')
          if start < 0 or end < 0 or end <= start: raise SystemExit('Encrypted Peter result marker missing from bootstrap log')
          payload = text[start + len('DGBN_RESULT_B64_BEGIN\n'):end].strip()
          data = base64.b64decode(payload, validate=True)
          if len(data) < 10000: raise SystemExit('Encrypted Peter result unexpectedly small')
          Path('peter-musetalk-12s.enc').write_bytes(data)
          print('Recovered encrypted Peter result from bootstrap log:', len(data), 'bytes')
          PY2
              test -s peter-musetalk-12s.enc
              echo 'PETER_MUSETALK_12S=PASS'
              exit 0
            elif [[ "$status" == FAIL:* ]]; then
              echo "Peter benchmark failed: $status" >&2
              curl -fsS --max-time 20 "$base/bootstrap.log" -o /tmp/bootstrap.log || true
              tail -n 180 /tmp/bootstrap.log || true
              exit 1
            fi
            if (( i % 12 == 0 )); then
              echo "Peter benchmark running ($((i*5))s)."
              curl -fsS --max-time 15 "$base/bootstrap.log" -o /tmp/bootstrap.log || true
              tail -n 25 /tmp/bootstrap.log || true
            fi
            sleep 5
          done
          echo 'Peter benchmark exceeded fifteen-minute wait.' >&2
          curl -fsS --max-time 20 "$base/bootstrap.log" -o /tmp/bootstrap.log || true
          tail -n 180 /tmp/bootstrap.log || true
          exit 1

      - name: Upload encrypted Peter result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: peter-musetalk-12s-encrypted
          path: peter-musetalk-12s.enc
          if-no-files-found: error
          retention-days: 1

      - name: Delete only the isolated Peter benchmark Pod
        if: always()
        shell: bash
        run: |
          set +e
          key=$(python - <<'PY'
          import os
          print(os.environ.get('RUNPOD_API_KEY_RAW','').strip().strip('“”‘’\"\'`'))
          PY
          )
          [[ -z "$key" ]] && exit 0
          echo "::add-mask::$key"
          AUTH="Authorization: Bearer $key"
          pods=$(curl -fsS -H "$AUTH" https://rest.runpod.io/v1/pods)
          while IFS= read -r pod_id; do
            [[ -z "$pod_id" ]] && continue
            echo "Deleting isolated Peter benchmark Pod: $pod_id"
            curl -fsS -X DELETE -H "$AUTH" "https://rest.runpod.io/v1/pods/$pod_id" >/dev/null
          done < <(jq -r '.[] | select(.name=="dgbn-peter-private-benchmark") | .id' <<<"$pods")
          echo 'Peter benchmark Pod cleanup complete.'

      - name: Delete temporary encrypted transfer branch
        if: always() && startsWith(github.ref_name, 'peter-private-benchmark-')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}" >/dev/null
          echo 'Temporary encrypted transfer branch deletion requested.'