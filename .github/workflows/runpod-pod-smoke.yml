name: DGBN normal Pod smoke test

on:
  push:
    paths:
      - '.runpod/pod-smoke.json'
      - '.github/workflows/runpod-pod-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RUNPOD_API_KEY_RAW: ${{ secrets.RUNPOD_API_KEY }}
      POD_NAME: dgbn-musetalk-debug
    steps:
      - uses: actions/checkout@v4

      - name: Normalize RunPod API key
        shell: bash
        run: |
          python - <<'PY'
          import os
          raw = os.environ['RUNPOD_API_KEY_RAW']
          key = raw.strip().translate({ord(c): None for c in '“”‘’\"\'`'})
          if not key:
              raise SystemExit('RUNPOD_API_KEY is empty')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'RUNPOD_API_KEY={key}\n')
          PY

      - name: Freeze Serverless and deploy DGBN debug Pod
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $RUNPOD_API_KEY"

          endpoints=$(curl -fsS -H "$AUTH" https://rest.runpod.io/v1/endpoints)
          endpoint_id=$(jq -r '.[] | select(.name=="dgbn-video-pipeline") | .id' <<<"$endpoints" | head -1)
          if [[ -z "$endpoint_id" || "$endpoint_id" == "null" ]]; then
            echo 'DGBN endpoint not found' >&2
            exit 1
          fi
          curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            -d '{"workersMin":0,"workersMax":0}' \
            "https://rest.runpod.io/v1/endpoints/$endpoint_id/update" >/dev/null
          echo "Serverless endpoint frozen: $endpoint_id"

          endpoint=$(curl -fsS -H "$AUTH" "https://rest.runpod.io/v1/endpoints/$endpoint_id")
          template_id=$(jq -r '.template.id // .templateId' <<<"$endpoint")
          template=$(curl -fsS -H "$AUTH" "https://rest.runpod.io/v1/templates/$template_id?includeEndpointBoundTemplates=true")
          image=$(jq -r '.imageName' <<<"$template")
          if [[ -z "$image" || "$image" == "null" ]]; then
            echo 'Could not resolve DGBN worker image' >&2
            exit 1
          fi
          echo "Using DGBN image: $image"

          # Remove only stale DGBN debug Pods. Never touch non-DGBN Pods.
          pods=$(curl -fsS -H "$AUTH" https://rest.runpod.io/v1/pods)
          while IFS= read -r stale_id; do
            [[ -z "$stale_id" ]] && continue
            echo "Deleting stale DGBN debug Pod: $stale_id"
            curl -fsS -X DELETE -H "$AUTH" "https://rest.runpod.io/v1/pods/$stale_id" >/dev/null || true
          done < <(jq -r '.[] | select(.name=="dgbn-musetalk-debug") | .id' <<<"$pods")

          START_CMD=$(cat <<'CMD'
          set -o pipefail; mkdir -p /tmp/dgbn; { echo "=== DGBN NORMAL POD DIAGNOSTICS ==="; date -u; echo "--- NVIDIA SMI ---"; nvidia-smi; echo "--- PYTORCH ---"; python -c "import torch; print('torch', torch.__version__); print('cuda_available', torch.cuda.is_available()); print('cuda_runtime', torch.version.cuda); print('gpu', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'NO_GPU')"; echo "--- FFMPEG ---"; ffmpeg -version | head -1; echo "--- WORKER HEALTHCHECK ---"; cd /worker && python -u handler.py --test_input '{"input":{"healthcheck":true}}'; rc=$?; echo "HEALTHCHECK_EXIT=$rc"; } > /tmp/dgbn/diagnostics.txt 2>&1; python -m http.server 8000 --directory /tmp/dgbn
          CMD
          )

          payload=$(jq -n \
            --arg name "$POD_NAME" \
            --arg image "$image" \
            --arg cmd "$START_CMD" \
            '{name:$name,imageName:$image,cloudType:"SECURE",computeType:"GPU",gpuCount:1,gpuTypeIds:["NVIDIA RTX A4000","NVIDIA RTX A4500","NVIDIA RTX A5000","NVIDIA GeForce RTX 3090","NVIDIA L4","NVIDIA GeForce RTX 4090","NVIDIA A40","NVIDIA RTX A6000","NVIDIA RTX 4000 Ada Generation"],gpuTypePriority:"availability",allowedCudaVersions:["11.8","12.0","12.1","12.2","12.3","12.4","12.5","12.6","12.7","12.8","12.9"],containerDiskInGb:30,ports:["8000/http"],interruptible:false,locked:false,dockerEntrypoint:["/bin/bash","-lc"],dockerStartCmd:[$cmd]}' )

          response=$(curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            -d "$payload" https://rest.runpod.io/v1/pods)
          pod_id=$(jq -r '.id' <<<"$response")
          if [[ -z "$pod_id" || "$pod_id" == "null" ]]; then
            echo "$response" >&2
            exit 1
          fi
          echo "pod_id=$pod_id" >> "$GITHUB_OUTPUT"
          echo "DGBN Pod created: $pod_id"
          jq '{id,name,costPerHr,adjustedCostPerHr,gpu:(.gpu.displayName // .machine.gpuDisplayName),machine:(.machine.dataCenterId // null),image}' <<<"$response"

      - name: Wait for diagnostics
        shell: bash
        run: |
          set -euo pipefail
          pod_id='${{ steps.deploy.outputs.pod_id }}'
          url="https://${pod_id}-8000.proxy.runpod.net/diagnostics.txt"
          echo "Waiting for DGBN Pod diagnostics: $url"
          for i in $(seq 1 48); do
            if curl -fsS --max-time 10 "$url" -o /tmp/diagnostics.txt; then
              cat /tmp/diagnostics.txt
              grep -q 'cuda_available True' /tmp/diagnostics.txt
              grep -q 'HEALTHCHECK_EXIT=0' /tmp/diagnostics.txt
              echo 'DGBN_NORMAL_POD_SMOKE=PASS'
              exit 0
            fi
            sleep 10
          done
          echo 'DGBN normal Pod did not expose diagnostics within 8 minutes' >&2
          exit 1

      - name: Cleanup DGBN debug Pod
        if: always()
        shell: bash
        run: |
          set +e
          AUTH="Authorization: Bearer $RUNPOD_API_KEY"
          pods=$(curl -fsS -H "$AUTH" https://rest.runpod.io/v1/pods)
          while IFS= read -r pod_id; do
            [[ -z "$pod_id" ]] && continue
            echo "Terminating DGBN debug Pod: $pod_id"
            curl -fsS -X DELETE -H "$AUTH" "https://rest.runpod.io/v1/pods/$pod_id"
          done < <(jq -r '.[] | select(.name=="dgbn-musetalk-debug") | .id' <<<"$pods")

          endpoints=$(curl -fsS -H "$AUTH" https://rest.runpod.io/v1/endpoints)
          endpoint_id=$(jq -r '.[] | select(.name=="dgbn-video-pipeline") | .id' <<<"$endpoints" | head -1)
          if [[ -n "$endpoint_id" && "$endpoint_id" != "null" ]]; then
            curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' \
              -d '{"workersMin":0,"workersMax":0}' \
              "https://rest.runpod.io/v1/endpoints/$endpoint_id/update" >/dev/null
            echo 'DGBN Serverless endpoint re-frozen.'
          fi
