name: Security cleanup - delete exposed run

on:
  push:
    paths:
      - '.github/workflows/security-delete-exposed-run.yml'

permissions:
  actions: write
  contents: read

jobs:
  delete-run:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete exposed workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/31429169175"
          echo 'Exposed workflow run deleted.'
