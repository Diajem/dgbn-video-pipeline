name: DSN Video Pipeline — Render + Qwen/Wan

on:
  workflow_dispatch:
    inputs:
      job_path:
        description: Repository path to an approved DSN_SHORT_MASTER_V1 job JSON
        required: true
        default: jobs/samples/dsn-short-master-v1.json
      artifact_name:
        description: Output artifact name
        required: false
        default: dsn-short-render
  repository_dispatch:
    types: [dsn_short_render]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVENT_NAME: ${{ github.event_name }}
      DISPATCH_JOB_JSON: ${{ toJson(github.event.client_payload.job) }}
      DISPATCH_STORY_ID: ${{ github.event.client_payload.story_id }}
      DISPATCH_ARTIFACT_NAME: ${{ github.event.client_payload.artifact_name }}
      CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
      WAN_3_API_KEY: ${{ secrets.WAN_3_API_KEY }}
      WAN_3_WORKSPACE_ID: ${{ secrets.WAN_3_WORKSPACE_ID }}
      WAN_3_REGION: ${{ secrets.WAN_3_REGION }}
      WAN_3_MODEL: ${{ secrets.WAN_3_MODEL }}
      WAN_3_MAX_SHOTS: "2"
      WAN_3_MAX_DURATION_SEC: "5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check Alibaba provider configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "DSN Alibaba provider preflight"
          echo "QWEN=NEWSROOM_RENDER_SERVICE"
          if [ -n "$WAN_3_API_KEY" ] && [ -n "$WAN_3_WORKSPACE_ID" ] && [ -n "$WAN_3_REGION" ]; then
            echo "WAN_3=CONFIGURED"
            echo "WAN_3_MODEL=${WAN_3_MODEL}"
            echo "WAN_3_REGION=${WAN_3_REGION}"
          else
            echo "WAN_3=NOT_CONFIGURED"
            exit 1
          fi

      - name: Resolve render job
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            mkdir -p jobs/renders
            node - <<'NODE'
          const fs = require('fs');
          const raw = process.env.DISPATCH_JOB_JSON;
          if (!raw || raw === 'null') throw new Error('repository_dispatch contained no DSN render job');
          const job = JSON.parse(raw);
          fs.writeFileSync('jobs/renders/dispatched-dsn-short.json', JSON.stringify(job, null, 2) + '\n');
          NODE
            echo "job_path=jobs/renders/dispatched-dsn-short.json" >> "$GITHUB_OUTPUT"
            echo "artifact_name=${DISPATCH_ARTIFACT_NAME:-dsn-short-render}" >> "$GITHUB_OUTPUT"
          else
            echo "job_path=${{ inputs.job_path }}" >> "$GITHUB_OUTPUT"
            echo "artifact_name=${{ inputs.artifact_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate DSN job
        run: node scripts/validate-dsn-short.mjs "${{ steps.resolve.outputs.job_path }}"

      - name: Stage remote production assets
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          STAGED_JOB_PATH="jobs/samples/dsn-short-master-v1.json"
          node scripts/stage-dsn-job.mjs "${{ steps.resolve.outputs.job_path }}" "$STAGED_JOB_PATH"
          echo "staged_job_path=$STAGED_JOB_PATH" >> "$GITHUB_OUTPUT"

      - name: Prepare approved Wan visual cues
        run: node scripts/prepare-dsn-wan-cues.mjs "${{ steps.stage.outputs.staged_job_path }}"

      - name: Revalidate staged production job
        run: node scripts/validate-dsn-short.mjs "${{ steps.stage.outputs.staged_job_path }}"

      - name: Render production MP4
        run: |
          mkdir -p renders
          cd video-studio/remotion
          npx remotion render src/index.jsx DSNShortMaster9x16 ../../renders/dsn-short.mp4

      - name: Upload production artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.resolve.outputs.artifact_name }}
          path: renders/dsn-short.mp4
          if-no-files-found: error

      - name: Report renderer result to newsroom
        if: always() && github.event_name == 'repository_dispatch' && env.CALLBACK_URL != ''
        env:
          CALLBACK_TOKEN: ${{ secrets.VIDEO_RENDER_CALLBACK_TOKEN }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_NAME: ${{ steps.resolve.outputs.artifact_name }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const status = process.env.JOB_STATUS === 'success' ? 'RENDERED' : 'FAILED';
          const body = {
            story_id: process.env.DISPATCH_STORY_ID,
            status,
            artifact_name: process.env.ARTIFACT_NAME || null,
            actions_url: process.env.RUN_URL,
            run_id: process.env.RUN_ID,
            error: status === 'FAILED' ? 'DSN renderer workflow failed; inspect the Actions run.' : null,
            metadata: {
              repository: process.env.GITHUB_REPOSITORY,
              workflow: process.env.GITHUB_WORKFLOW,
              commit: process.env.GITHUB_SHA,
              artifact_url: process.env.ARTIFACT_URL || null,
              artifact_id: process.env.ARTIFACT_ID || null,
              artifact_digest: process.env.ARTIFACT_DIGEST || null
            }
          };
          fs.writeFileSync('/tmp/dsn-render-callback.json', JSON.stringify(body));
          NODE
          if [ -z "$CALLBACK_TOKEN" ]; then
            echo "VIDEO_RENDER_CALLBACK_TOKEN secret is not configured" >&2
            exit 1
          fi
          curl --fail --silent --show-error --location \
            -X POST "$CALLBACK_URL" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/dsn-render-callback.json
