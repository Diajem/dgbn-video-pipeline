name: Inspect DGBN MuseTalk E2E Pod

on:
  push:
    paths:
      - '.github/workflows/runpod-musetalk-inspect.yml'
      - '.runpod/musetalk-inspect.json'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      RUNPOD_API_KEY_RAW: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Inspect exact DGBN MuseTalk Pod
        shell: bash
        run: |
          set -euo pipefail
          key=$(python - <<'PY'
          import os
          raw = os.environ.get('RUNPOD_API_KEY_RAW', '')
          print(raw.strip().strip('“”‘’\"\'`'))
          PY
          )
          echo "::add-mask::$key"
          AUTH="Authorization: Bearer $key"
          pods=$(curl -fsS -H "$AUTH" https://rest.runpod.io/v1/pods)
          pod_id=$(jq -r '.[] | select(.name=="dgbn-musetalk-e2e-smoke") | .id' <<<"$pods" | head -1)
          if [[ -z "$pod_id" || "$pod_id" == null ]]; then
            echo 'DGBN MuseTalk E2E Pod not present.'
            exit 0
          fi
          jq --arg id "$pod_id" '.[] | select(.id==$id) | {id,name,desiredStatus,costPerHr,gpu:(.gpu.displayName // .machine.gpuDisplayName // null),dataCenter:(.machine.dataCenterId // null),publicIp,portMappings,lastStatusChange,lastStartedAt}' <<<"$pods"
          base="https://${pod_id}-8000.proxy.runpod.net"
          echo '--- STATUS ---'
          curl -fsS --max-time 10 "$base/status.txt" || echo 'status pending'
          echo
          echo '--- BOOTSTRAP TAIL ---'
          curl -fsS --max-time 15 "$base/bootstrap.log" | tail -n 100 || echo 'bootstrap log not reachable yet'
