name: Abort exact DGBN Peter benchmark Pod

on:
  push:
    paths:
      - '.github/workflows/runpod-peter-abort.yml'

permissions:
  contents: read

jobs:
  abort:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      RUNPOD_API_KEY_RAW: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Delete exact temporary DGBN Peter Pod only
        shell: bash
        run: |
          set -euo pipefail
          key=$(python - <<'PY'
          import os
          print(os.environ.get('RUNPOD_API_KEY_RAW','').strip().strip('“”‘’\"\'`'))
          PY
          )
          test -n "$key"
          echo "::add-mask::$key"
          AUTH="Authorization: Bearer $key"
          pods=$(curl -fsS -H "$AUTH" https://rest.runpod.io/v1/pods)
          pod_id=$(jq -r '.[] | select(.name=="dgbn-peter-private-benchmark") | .id' <<<"$pods" | head -1)
          if [[ -z "$pod_id" || "$pod_id" == null ]]; then
            echo 'No DGBN Peter benchmark Pod is running.'
            exit 0
          fi
          if [[ "$pod_id" != "pmhcp48b3c7ouf" ]]; then
            echo "Safety guard: current DGBN Peter Pod ID differs from inspected ID; refusing deletion: $pod_id" >&2
            exit 1
          fi
          echo "Deleting exact DGBN Peter benchmark Pod: $pod_id"
          curl -fsS -X DELETE -H "$AUTH" "https://rest.runpod.io/v1/pods/$pod_id" >/dev/null
          echo 'Exact DGBN Peter benchmark Pod deleted.'
