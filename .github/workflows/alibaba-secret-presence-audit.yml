name: Alibaba secret presence audit

on:
  push:
    branches:
      - agent/alibaba-secret-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      QWEN_WORKSPACE_ID: ${{ secrets.QWEN_WORKSPACE_ID }}
      QWEN_REGION: ${{ secrets.QWEN_REGION }}
      QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
      WAN_3_API_KEY: ${{ secrets.WAN_3_API_KEY }}
      WAN_3_WORKSPACE_ID: ${{ secrets.WAN_3_WORKSPACE_ID }}
      WAN_3_REGION: ${{ secrets.WAN_3_REGION }}
      WAN_3_MODEL: ${{ secrets.WAN_3_MODEL }}
    steps:
      - name: Check required secret names
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in QWEN_API_KEY QWEN_WORKSPACE_ID QWEN_REGION QWEN_BASE_URL WAN_3_API_KEY WAN_3_WORKSPACE_ID WAN_3_REGION WAN_3_MODEL; do
            if [ -n "${!name:-}" ]; then
              echo "${name}=PRESENT"
            else
              echo "${name}=MISSING"
              missing=1
            fi
          done
          exit "$missing"
