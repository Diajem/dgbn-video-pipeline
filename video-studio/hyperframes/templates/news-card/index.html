<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DGBN Hyperframes News Card Prototype</title>
  <style>
    html,body{margin:0;width:1080px;height:1920px;background:#070707;color:white;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
    body{box-sizing:border-box;padding:90px;background:linear-gradient(145deg,#050505 0%,#171717 62%,#2b1d00 100%);border-top:14px solid #d7a62a}
    .brand{font-weight:900;letter-spacing:4px;font-size:34px;color:#d7a62a}.tag{display:inline-block;margin-top:180px;padding:12px 18px;background:#d7a62a;color:#050505;font-weight:900;font-size:32px}.headline{font-size:78px;line-height:1.02;font-weight:900;margin-top:34px}.visual{height:650px;border:2px solid rgba(215,166,42,.45);border-radius:34px;margin-top:55px;display:grid;place-items:center;color:#aaa;font-size:30px;padding:50px;text-align:center}.callout{font-size:38px;font-weight:700;line-height:1.35;margin-top:50px}.footer{position:absolute;bottom:75px;left:90px;right:90px;border-top:2px solid rgba(215,166,42,.45);padding-top:20px;font-size:27px;font-weight:800}
  </style>
</head>
<body>
  <div class="brand">DGBN</div>
  <div class="tag">NEWS CARD</div>
  <div class="headline">Story headline from production manifest</div>
  <div class="visual">Hyperframes motion-graphic / image / chart slot</div>
  <div class="callout">Key callout from the verified story pack.</div>
  <div class="footer">Our People. Our Story. Our Own Way.</div>
</body>
</html>
